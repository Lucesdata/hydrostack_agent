name: Hero Two Services Formatter Temporary
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/hero-two-services-format-temp.yml"
      - "app/talento/page.tsx"
      - "src/components/landing/hero-territorial/hero-v3.module.css"
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Print canonical format
        run: |
          for f in app/talento/page.tsx src/components/landing/hero-territorial/hero-v3.module.css; do
            npx prettier --write "$f" >/dev/null
            echo "FORMAT_BEGIN:$f"
            base64 -w0 "$f"
            echo
            echo "FORMAT_END:$f"
          done
