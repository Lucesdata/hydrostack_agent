name: Talent Format Preview
on:
  pull_request:
    paths:
      - ".github/workflows/talent-format-preview.yml"
      - "src/lib/talent-intelligence/**"
      - "src/__tests__/talent-intelligence/**"
permissions:
  contents: read
jobs:
  format-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Print formatted file content
        shell: bash
        run: |
          for f in src/lib/talent-intelligence/role-taxonomy.ts src/lib/talent-intelligence/staff-requirements.ts src/__tests__/talent-intelligence/staff-requirements.test.ts src/lib/talent-intelligence/document-requirements.ts src/__tests__/talent-intelligence/document-requirements.test.ts; do
            npx prettier --write "$f" >/dev/null
            echo "FORMAT_BEGIN:$f"
            base64 -w0 "$f"
            echo
            echo "FORMAT_END:$f"
          done
