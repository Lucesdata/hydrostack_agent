name: Talent Schema Format Temporary
on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/talent-schema-format-temp.yml"
      - "scripts/talent/revision-manual.schema.json"
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Print canonical JSON formatting
        run: |
          f=scripts/talent/revision-manual.schema.json
          npx prettier --write "$f" >/dev/null
          echo "FORMAT_BEGIN:$f"
          base64 -w0 "$f"
          echo
          echo "FORMAT_END:$f"
