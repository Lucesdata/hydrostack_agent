<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Inspeccionar modelo (.glb)</title>
<script type="importmap">{ "imports": { "three": "../vendor/three/three.module.js", "three/addons/": "../vendor/three/" } }</script>
<style>body{font:14px system-ui;margin:1.5rem}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:2px 8px;text-align:right}td:first-child{text-align:left}</style></head>
<body><h1>Inspeccionar modelo</h1><p>Uso: <code>?modelo=../assets/archivo.glb</code>. Lista los nodos de primer nivel con su caja en metros (mundo), triángulos y animaciones.</p><pre id="o">cargando…</pre><script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
const url = new URLSearchParams(location.search).get("modelo");
const gltf = await new GLTFLoader().loadAsync(url);
const root = gltf.scene; root.updateMatrixWorld(true);
const f = (v) => v.toArray().map((n) => n.toFixed(2)).join(", ");
const tri = (o) => { let t = 0; o.traverse((m) => { if (m.isMesh) t += (m.geometry.index ? m.geometry.index.count : m.geometry.attributes.position.count) / 3; }); return t; };
const out = { total: new THREE.Box3().setFromObject(root), nodos: [], animaciones: gltf.animations.map((a) => ({ nombre: a.name, dur: a.duration, pistas: a.tracks.map((t) => t.name + " (" + t.constructor.name + ")") })) };
root.children.forEach((c) => { const b = new THREE.Box3().setFromObject(c); out.nodos.push({ nombre: c.name, tipo: c.type, hijos: c.children.length, tri: tri(c), min: b.min.toArray(), max: b.max.toArray(), pos: c.position.toArray(), rot: c.rotation.toArray().slice(0, 3), esc: c.scale.toArray() }); });
out.materiales = [...new Set((() => { const s = []; root.traverse((m) => m.isMesh && s.push(m.material.name + " " + m.material.color.getHexString() + " m" + m.material.metalness.toFixed(1) + " r" + m.material.roughness.toFixed(1))); return s; })())];
window.__info = out;
document.getElementById("o").textContent = JSON.stringify(out, null, 1);
</script></body></html>
